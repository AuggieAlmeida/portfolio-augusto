# Quality gate only. A publicação é feita pela integração Git da Vercel, que
# constrói a partir de `main` por conta própria. Havia aqui um job que chamava
# amondnet/vercel-action sem `vercel-org-id` nem `vercel-project-id` e sem um
# `.vercel/project.json` no repo — ele não conseguia alcançar o projeto
# existente. Para que este gate realmente proteja o deploy, exigir o check
# `Lint, test and build` em branch protection para `main`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check i18n key parity
        run: npm run i18n:check

      - name: Run tests
        run: npm run test:ci

      - name: Build
        run: npm run build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Blocking gate: nothing critical may reach a visitor's browser.
      - name: Audit runtime dependencies
        run: npm run security:audit

      # Advisory only. Every remaining advisory — including the high ones in
      # @angular/core and @angular/compiler — is fixed solely by Angular 22,
      # a major upgrade this app has deliberately deferred. Blocking on it
      # would leave main permanently red and train everyone to ignore it.
      - name: Audit everything (advisory)
        continue-on-error: true
        run: npm run security:audit:full
