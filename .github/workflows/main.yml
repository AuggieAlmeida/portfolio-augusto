name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check i18n key parity
        run: npm run i18n:check

      - name: Run tests
        run: npm run test:ci

      - name: Build
        run: npm run build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Blocking gate: nothing critical may reach a visitor's browser.
      - name: Audit runtime dependencies
        run: npm run security:audit

      # Advisory only. Every remaining advisory — including the high ones in
      # @angular/core and @angular/compiler — is fixed solely by Angular 22,
      # a major upgrade this app has deliberately deferred. Blocking on it
      # would leave main permanently red and train everyone to ignore it.
      - name: Audit everything (advisory)
        continue-on-error: true
        run: npm run security:audit:full

  deploy:
    name: Deploy to Vercel
    needs: [quality, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      # Vercel builds from source; uploading the local dist would be discarded.
      - name: Deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --yes'
          working-directory: ./
          github-comment: false
          github-deployment: false
